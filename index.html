<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Makrá">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Makrá</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b14;--card:#17141f;--card2:#201c2b;--line:#2b2638;--txt:#ece9f3;--mut:#9690a8;--acc:#8b6cff;--acc2:#b9a6ff;--p:#5fb3ff;--c:#ffc15e;--f:#ff7a9c;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(13,11,20,.94);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:22px;font-weight:800;flex:1;text-align:center}
.ib{background:var(--card2);border:0;border-radius:10px;width:38px;height:38px;font-size:18px}
main{padding:14px 16px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.tot{padding:16px}
.kc{display:flex;align-items:baseline;gap:8px}.kc b{font-size:40px;font-weight:800;letter-spacing:-.02em}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;font-size:13px;color:var(--mut)}.mac b{display:block;font-size:17px;color:var(--txt)}
.mut{color:var(--mut)}.sm{font-size:13px}
h2{font-size:16px;margin:22px 0 8px;color:var(--acc2);font-weight:600}
.ent{display:flex;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}.ent:last-child{border:0}
.ent img,.ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none}
.ent .n{font-weight:600;line-height:1.2}.grow{flex:1;min-width:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(18,15,26,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.btn{background:var(--acc);border:0;border-radius:12px;padding:13px 14px;font-weight:600;color:#fff}
.btn.g{background:var(--card2);color:var(--txt)}.btn.w{width:100%}.btn:disabled{opacity:.5}
.dock .btn{flex:1;padding:13px 6px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sh{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sh h3{margin:0;flex:1;font-size:18px}
.in{padding:16px 16px calc(30px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
input[type=text],input[type=number],input[type=search],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus{border-color:var(--acc)}
label{display:block;margin:12px 0 5px;font-size:14px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pimg{width:100%;max-height:240px;object-fit:contain;background:#fff;border-radius:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
.big{font-size:28px;font-weight:800}
#vid{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:16px;display:block}
.scanwrap{position:relative}.scanwrap:after{content:"";position:absolute;left:10%;right:10%;top:45%;height:2px;background:var(--bad);box-shadow:0 0 12px var(--bad)}
.msg{padding:12px;border-radius:12px;background:var(--card2);margin:10px 0;font-size:14px}
.msg.err{background:#3a1820;color:#ffb3c0}
.res{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
details{margin-top:10px}summary{color:var(--acc2);cursor:pointer;padding:6px 0}
.ing{font-size:13px;line-height:1.5;color:var(--mut)}
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 8px}.sec h2{margin:0;flex:1}.sec .k{color:var(--mut);font-size:14px}
.mini{background:var(--card2);border:0;border-radius:9px;padding:6px 10px;font-size:13px;color:var(--txt)}
.mini.acc{background:var(--acc);color:#fff;font-size:18px;line-height:1;padding:5px 11px}
.water{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:10px}
.water b{font-size:18px}.water .grow{font-size:14px}
.mrow{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.mrow:last-child{border:0}
.mrow input{width:76px;padding:8px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;flex:none}.chk.on{background:var(--acc);border-color:var(--acc)}
.days{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:10px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);height:100%;justify-content:flex-end}
.days i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);min-height:2px}
.days i.over{background:var(--bad)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat div{background:var(--card2);border-radius:12px;padding:10px;font-size:13px;color:var(--mut)}.stat b{display:block;font-size:20px;color:var(--txt)}
.menu .btn{width:100%;margin-top:8px;text-align:left}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes s{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<header><button class="ib" data-day="-1" aria-label="Predchádzajúci deň">‹</button><h1 id="dayT">Dnes</h1><button class="ib" data-day="1" aria-label="Ďalší deň">›</button><button class="ib" data-open-settings aria-label="Nastavenia">⚙</button></header>
<main id="main"></main>
<div class="dock"><button class="btn" data-scan>Skenovať</button><button class="btn g" data-addmenu>Pridať</button><button class="btn g" data-overview>Prehľad</button></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="photo" accept="image/*" capture="environment" hidden>
<input type="file" id="mealphoto" accept="image/*" capture="environment" hidden>

<script src="zxing.min.js"></script>
<script>
"use strict";
// ---------- storage: everything lives in this phone; optional cloud backup to your own Supabase with your secret code
const DATA_KEYS=["products","log","goals","recent","profile","meals","water","weights","bike","peptides","supps","suppLog"];
let restoring=false;
const ls={get(k,d){try{const v=localStorage.getItem("makra_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("makra_"+k,JSON.stringify(v))}catch(e){alert("Nepodarilo sa uložiť dáta v telefóne.")}if(DATA_KEYS.includes(k)&&!restoring)markDirty()}};
let products=ls.get("products",{}), log=ls.get("log",{}), goals=ls.get("goals",{kcal:2200,p:150,c:220,f:70}),
    cfg={model:"gemini-3.5-flash-lite",key:"",stepsKey:"",water:8,...ls.get("cfg",{})}, recent=ls.get("recent",[]),
    steps=ls.get("steps",{}), meals=ls.get("meals",{}), water=ls.get("water",{}), weights=ls.get("weights",{}), bike=ls.get("bike",{}),
    peptides=ls.get("peptides",[]), supps=ls.get("supps",[]), suppLog=ls.get("suppLog",{});
const SUPA="https://dlbgfzjgkuwubomihkux.supabase.co",SUPA_KEY="sb_publishable_mp28D-V0T8ZAHW410MStGw_KWIFq5Dw";
const rpc=async(fn,body)=>{const r=await fetch(`${SUPA}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const txt=await r.text(),j=txt?JSON.parse(txt):null;
  if(!r.ok)throw new Error(j?.message||"HTTP "+r.status);return j};

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return iso(x)};
let day=iso(new Date());
const N=["kcal","p","c","f","sugar","fiber","salt"], LBL={kcal:"Energia (kcal)",p:"Bielkoviny (g)",c:"Sacharidy (g)",f:"Tuky (g)",sugar:"z toho cukry (g)",fiber:"Vláknina (g)",salt:"Soľ (g)"};
const M=["kcal","p","c","f"];
const r1=x=>Math.round(x*10)/10, fmt=x=>r1(x).toLocaleString("sk-SK"), num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)&&n>=0?n:null};
const calc=(per,g)=>Object.fromEntries(M.map(k=>[k,(per[k]||0)*g/100]));
const sum=list=>list.reduce((t,e)=>(M.forEach(k=>t[k]+=e[k]||0),t),{kcal:0,p:0,c:0,f:0});
const validCode=c=>/^\d{8,14}$/.test(c);

// ---------- meal sections
const SECS=[["r","Raňajky"],["o","Obed"],["v","Večera"],["s","Medzijedlá"]], SECN=Object.fromEntries(SECS);
const defaultSec=()=>{const h=new Date().getHours();return h<10?"r":h<15?"o":h<17?"s":h<21?"v":"s"};
const secOf=e=>e.m||(h=>h<10?"r":h<15?"o":h<17?"s":"v")(new Date(e.t||0).getHours());
let sec=defaultSec();
const secChips=()=>`<label>Kam</label><div class="chips" id="secs">${SECS.map(([k,l])=>`<button class="chip ${k===sec?"on":""}" data-sec="${k}">${l}</button>`).join("")}</div>`;
function pushEntry(entry,editIdx){
  entry={...entry,m:sec,t:entry.t||Date.now()};
  (log[day]=log[day]||[]);editIdx!=null?log[day][editIdx]=entry:log[day].push(entry);ls.set("log",log);
}

// ---------- steps from iPhone (Shortcuts -> Supabase)
let stepsErr="";
async function syncSteps(){
  if(!cfg.stepsKey)return;
  try{(await rpc("makra_get_steps",{secret:cfg.stepsKey,since:addDays(iso(new Date()),-30)})).forEach(x=>steps[x.day]=x.steps);ls.set("steps",steps);stepsErr=""}
  catch(e){stepsErr=e.message}
  if(!sheet.classList.contains("open"))render();
}

// ---------- cloud backup (same secret code)
let dirtyT=null,backupErr="";
function markDirty(){if(!cfg.stepsKey)return;clearTimeout(dirtyT);dirtyT=setTimeout(cloudSave,4000)}
async function cloudSave(){
  clearTimeout(dirtyT);dirtyT=null;if(!cfg.stepsKey)return;
  try{await rpc("makra_backup_save",{secret:cfg.stepsKey,data:Object.fromEntries(DATA_KEYS.map(k=>[k,ls.get(k,null)]))});
    localStorage.setItem("makra_backupAt",String(Date.now()));backupErr=""}
  catch(e){backupErr=e.message}
}
async function cloudLoad(){const d=await rpc("makra_backup_load",{secret:cfg.stepsKey});return d&&d.data?d:null}
function applyBackup(data){restoring=true;DATA_KEYS.forEach(k=>{if(data[k]!=null)ls.set(k,data[k])});localStorage.setItem("makra_backupAt",String(Date.now()));location.reload()}
// First start with a code on this phone: offer the cloud copy before anything overwrites it.
async function firstSync(){
  if(!cfg.stepsKey||localStorage.getItem("makra_backupAt"))return;
  try{
    const d=await cloudLoad();
    if(d&&d.data.log&&Object.keys(d.data.log).length){
      const localEmpty=!Object.keys(log).length;
      if(localEmpty||confirm("V cloude je záloha Makrá. Nahradiť ňou dáta v tomto telefóne?"))return applyBackup(d.data);
    }
    cloudSave();
  }catch(e){backupErr=e.message}
}

// ---------- day goals: your calories, macros from your weight (+ steps if enabled)
const STEP_BASE=3000,STEP_KCAL=0.0004,BIKE_KCAL_PER_KM=0.225;
const PEPTIDE_PKG=2.2; // g/kg protein on GLP-1 to preserve muscle
let prof={sex:"m",age:null,h:null,w:null,kcal:null,pkg:1.8,fatPct:25,useSteps:false,useBike:false,usePeptides:false,...ls.get("profile",{})};
function computeGoals(pr,st,bk){
  if(!pr.kcal||!pr.w)return null;
  const stepBonus=pr.useSteps&&st!=null?Math.round(Math.max(0,st-STEP_BASE)*STEP_KCAL*pr.w):0;
  const bikeBonus=pr.useBike&&bk?Math.round(bk*BIKE_KCAL_PER_KM*pr.w):0;
  const bonus=stepBonus+bikeBonus, kcal=pr.kcal+bonus,
    pkg=pr.usePeptides?Math.max(pr.pkg,PEPTIDE_PKG):pr.pkg,
    p=Math.round(pr.w*pkg), f=Math.round(kcal*pr.fatPct/100/9), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {bonus,stepBonus,bikeBonus,kcal,p,c,f,pkg};
}
const bmrOf=pr=>pr.age&&pr.h&&pr.w?Math.round(10*pr.w+6.25*pr.h-5*pr.age+(pr.sex==="f"?-161:5)):null;
function dayGoals(d){const r=computeGoals(prof,steps[d],bike[d]);return r?{kcal:r.kcal,p:r.p,c:r.c,f:r.f}:goals}

// ---------- day view
const bar=(v,g,col)=>`<div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:${col};${v>g*1.05&&col==="var(--acc)"?"background:var(--bad)":""}"></i></div>`;
const entryRow=(e,i)=>`<div class="ent" data-entry="${i}">${e.img?`<img src="${esc(e.img)}" alt="" loading="lazy">`:`<div class="ph"></div>`}<div class="grow"><div class="n">${esc(e.name)}</div><div class="mut sm">${e.g?`${fmt(e.g)} g · `:""}B ${fmt(e.p)} · S ${fmt(e.c)} · T ${fmt(e.f)}</div></div><b>${Math.round(e.kcal)}</b></div>`;
function render(){
  const today=iso(new Date()), y=addDays(today,-1);
  $("#dayT").textContent=day===today?"Dnes":day===y?"Včera":new Date(day+"T12:00").toLocaleDateString("sk-SK",{weekday:"short",day:"numeric",month:"numeric"});
  const items=log[day]||[], t=sum(items), g=dayGoals(day), st=steps[day], bk=bike[day]||0, left=g.kcal-t.kcal, wt=water[day]||0, prev=log[addDays(day,-1)]||[], bikeGoals=computeGoals(prof,st,bk);
  let h=`<div class="card tot"><div class="kc"><b>${Math.round(t.kcal)}</b><span class="mut">/ ${g.kcal} kcal</span></div>
    <div class="sm ${left<0?"":"mut"}" style="${left<0?"color:var(--bad)":""}">${left>=0?`zostáva ${Math.round(left)} kcal`:`prekročené o ${Math.round(-left)} kcal`}</div>${bar(t.kcal,g.kcal,"var(--acc)")}
    ${cfg.stepsKey?`<div class="sm mut" style="margin-top:8px">${st!=null?`${st.toLocaleString("sk-SK")} krokov`:"Kroky zatiaľ neprišli"}${bikeGoals&&bikeGoals.bonus?` · +${bikeGoals.bonus} kcal bonus`:""} · <a href="shortcuts://run-shortcut?name=Makr%C3%A1%20kroky" style="color:var(--acc2);text-decoration:none">sync</a> · <button style="background:none;border:0;color:var(--acc2);font:inherit;font-size:inherit;padding:0;cursor:pointer" data-refresh-steps>obnoviť</button>${stepsErr?` · <span style="color:var(--bad)">${esc(stepsErr)}</span>`:""}</div>`:""}
    <div class="mac"><div>Bielkoviny<b>${Math.round(t.p)} <span class="mut sm">/ ${g.p} g</span></b>${bar(t.p,g.p,"var(--p)")}</div>
    <div>Sacharidy<b>${Math.round(t.c)} <span class="mut sm">/ ${g.c} g</span></b>${bar(t.c,g.c,"var(--c)")}</div>
    <div>Tuky<b>${Math.round(t.f)} <span class="mut sm">/ ${g.f} g</span></b>${bar(t.f,g.f,"var(--f)")}</div></div></div>
   <div class="card water"><div class="grow">Voda<br><span class="mut sm">${(wt*0.25).toLocaleString("sk-SK")} l z ${(cfg.water*0.25).toLocaleString("sk-SK")} l</span></div>
    <button class="mini" data-water="-1" aria-label="Menej vody">−</button><b>${wt} / ${cfg.water}</b><button class="mini acc" data-water="1" aria-label="Pridať pohár">+</button></div>
   <div class="card water"><div class="grow">Bicykel<br><span class="mut sm">${bk?`${r1(bk)} km`:`žiadna jazda`}${bikeGoals&&bikeGoals.bikeBonus?` · +${bikeGoals.bikeBonus} kcal`:""}</span></div>
    ${bk?`<button class="mini" data-bike-clear aria-label="Vymazať">×</button>`:""}<button class="mini acc" data-bike-add aria-label="Pridať jazdu">+</button></div>`;
  // peptide dose tracker
  if(prof.usePeptides){
    const lastDose=peptides.length?peptides[peptides.length-1]:null;
    const daysAgo=lastDose?Math.floor((new Date(day+"T12:00")-new Date(lastDose+"T12:00"))/864e5):null;
    const due=lastDose&&daysAgo>=7;
    h+=`<div class="card water"><div class="grow">GLP-1<br><span class="mut sm">${lastDose?`${daysAgo===0?"dnes":daysAgo===1?"včera":`pred ${daysAgo} d`}${due?` · <span style="color:var(--bad)">ďalšia dávka</span>`:""}`:"žiadna dávka"}</span></div>
      <button class="mini acc" data-peptide-dose aria-label="Zaznamenať dávku">+</button></div>`;
  }
  // supplement checklist
  if(supps.length){
    const dayLog=suppLog[day]||{};
    h+=`<div class="sec"><h2>Doplnky</h2><button class="mini" data-supps-edit>upraviť</button></div><div class="card">`;
    supps.forEach((s,i)=>{const done=!!dayLog[i];
      h+=`<div class="mrow"><button class="chk ${done?"on":""}" data-supp-check="${i}" aria-label="${s.name}"></button><div class="grow"><div class="n">${esc(s.name)}</div><div class="mut sm">${esc(s.note||"")}${s.time?` · ${s.time}`:""}</div></div></div>`;
    });
    h+=`</div>`;
  }
  for(const [k,l] of SECS){
    const idx=items.map((e,i)=>[e,i]).filter(([e])=>secOf(e)===k), s=sum(idx.map(x=>x[0])), py=prev.filter(e=>secOf(e)===k);
    h+=`<div class="sec"><h2>${l}</h2>${idx.length?`<span class="k">${Math.round(s.kcal)} kcal</span>`:""}
      ${!idx.length&&py.length?`<button class="mini" data-copy-y="${k}">Ako včera</button>`:""}
      ${idx.length>1?`<button class="mini" data-save-sec="${k}">Uložiť ako jedlo</button>`:""}
      <button class="mini acc" data-addmenu="${k}" aria-label="Pridať do: ${l}">+</button></div>
      ${idx.length?`<div class="card">${idx.map(([e,i])=>entryRow(e,i)).join("")}</div>`:""}`;
  }
  $("#main").innerHTML=h;
}

// ---------- sheets
const sheet=$("#sheet");
function open(html){stopScan();sheet.innerHTML=html;sheet.classList.add("open");sheet.scrollTop=0}
function close(){stopScan();if(building&&!sheet.querySelector("#builder"))return openBuilder();building=null;sheet.classList.remove("open");sheet.innerHTML="";render()}
const head=t=>`<div class="sh"><button class="ib" data-close aria-label="Zavrieť">×</button><h3>${t}</h3></div>`;

function addMenu(k){
  if(k)sec=k;
  const prev=(log[addDays(day,-1)]||[]).filter(e=>secOf(e)===sec);
  open(head("Pridať")+`<div class="in menu">${secChips()}
    <button class="btn" data-scan>Skenovať čiarový kód</button>
    <button class="btn g" data-search>Hľadať potravinu</button>
    <button class="btn g" data-meals>Moje jedlá</button>
    <button class="btn g" data-photomeal>Odhad z fotky jedla</button>
    <button class="btn g" data-quick>Rýchle kalórie</button>
    <button class="btn g" data-new>Nový produkt (etiketa)</button>
    ${prev.length?`<button class="btn g" data-copy-y="${sec}">Ako včera (${prev.length} ${prev.length===1?"položka":"položky"})</button>`:""}</div>`);
}

// ---------- scanner
let scanCtl=null;
function stopScan(){try{scanCtl?.stop()}catch(e){}scanCtl=null}
async function scan(){
  open(head(building?"Skenovať do jedla":"Skenovať")+`<div class="in"><div class="scanwrap"><video id="vid" playsinline muted></video></div>
  <p class="mut sm">Namier kameru na čiarový kód.</p><div id="smsg"></div>
  <label>Alebo zadaj kód ručne</label><div style="display:flex;gap:8px"><input type="text" id="code" inputmode="numeric" placeholder="8586…"><button class="btn" data-code>OK</button></div></div>`);
  try{
    const reader=new ZXingBrowser.BrowserMultiFormatOneDReader();

async function lookup(code){
  if(products[code])return showProduct(products[code]);
  open(head("Hľadám…")+`<div class="in"><p><span class="spin"></span>Hľadám ${esc(code)} v Open Food Facts…</p></div>`);
  let p=null,err=null;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?lc=sk&fields=code,product_name,product_name_sk,product_name_cs,generic_name,brands,quantity,product_quantity,serving_quantity,nutriments,ingredients_text_sk,ingredients_text_cs,ingredients_text,allergens_tags,image_front_small_url`);
    if(r.status!==404&&!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();if(j.status===1&&j.product)p=fromOFF(j.product,code);
  }catch(e){err=e}
  if(!sheet.classList.contains("open"))return;
  if(p&&p.per.kcal!=null){products[code]=p;ls.set("products",products);return showProduct(p)}
  editProduct({code,name:p?.name||"",brand:p?.brand||"",img:p?.img||"",ingredients:p?.ingredients||"",per:p?.per||{},pack:p?.pack,serving:p?.serving},
    err?`Databáza neodpovedá (${esc(err.message)}). Skontroluj internet, alebo zadaj hodnoty z etikety.`
       :p?"Produkt je v databáze, ale bez nutričných hodnôt. Odfoť etiketu alebo ich prepíš.":"Tento kód ešte nikto nepridal. Odfoť tabuľku nutričných hodnôt a doplním ju, alebo ich prepíš ručne.");
}
function fromOFF(o,code){
  const n=o.nutriments||{}, g=k=>num(n[k+"_100g"]);
  const kcal=g("energy-kcal")??(g("energy")!=null?g("energy")/4.184:null);
  return {code,src:"off",name:(o.product_name_sk||o.product_name_cs||o.product_name||o.generic_name||"").trim(),brand:(o.brands||"").split(",")[0].trim(),
    img:o.image_front_small_url||"",ingredients:o.ingredients_text_sk||o.ingredients_text_cs||o.ingredients_text||"",
    allergens:(o.allergens_tags||[]).map(a=>a.replace(/^\w+:/,"")).join(", "),
    per:{kcal:kcal!=null?r1(kcal):null,p:g("proteins"),c:g("carbohydrates"),f:g("fat"),sugar:g("sugars"),fiber:g("fiber"),salt:g("salt")},
    pack:num(o.product_quantity)||null,serving:num(o.serving_quantity)||null};
}

// ---------- Gemini (your own key, stored only on this phone)
async function gemini(prompt,file){
  if(!cfg.key)throw new Error("najprv vlož Gemini API kľúč v nastaveniach (⚙)");
  const b64=await shrink(file);
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
    body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],generationConfig:{response_mime_type:"application/json",temperature:0}})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||"HTTP "+r.status);
  return JSON.parse(j.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||"{}");
}
async function readLabel(file){
  const box=$("#pmsg");box.innerHTML=`<div class="msg"><span class="spin"></span>Čítam etiketu…</div>`;
  try{
    const d=await gemini(`This is a photo of a food package, usually its nutrition table (often Slovak/Czech: "Výživové údaje", "Energetická hodnota", "Bielkoviny", "Sacharidy", "z toho cukry", "Tuky", "Vláknina", "Soľ"). Return JSON only:
{"name":string|null,"brand":string|null,"kcal":number|null,"p":number|null,"c":number|null,"f":number|null,"sugar":number|null,"fiber":number|null,"salt":number|null,"serving":number|null,"pack":number|null,"ingredients":string|null}
Values must be per 100 g or 100 ml (use the per-100 column; if only per-serving values exist, convert using the serving size). kcal is kilocalories, not kJ. serving and pack are grams/ml if printed. Use null for anything not visible. Never guess numbers.`,file);
    let filled=0;
    N.forEach(k=>{const v=num(d[k]);if(v!=null){$("#n_"+k).value=r1(v);filled++}});
    if(d.name&&!$("#pn").value)$("#pn").value=d.name;
    if(d.brand&&!$("#pb").value)$("#pb").value=d.brand;
    if(num(d.serving)&&!$("#ps").value)$("#ps").value=num(d.serving);
    if(num(d.pack)&&!$("#pk").value)$("#pk").value=num(d.pack);
    if(d.ingredients&&!$("#pi").value)$("#pi").value=d.ingredients;
    box.innerHTML=filled?`<div class="msg">Načítané ${filled} hodnôt. Skontroluj ich podľa etikety a ulož.</div>`
      :`<div class="msg err">Na fotke som nenašiel nutričnú tabuľku. Skús ju odfotiť zblízka a ostro.</div>`;
  }catch(e){box.innerHTML=`<div class="msg err">Nepodarilo sa prečítať etiketu: ${esc(e.message)}</div>`}
}
function shrink(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.85).split(",")[1])};
  im.onerror=()=>bad(new Error("fotku sa nepodarilo otvoriť"));im.src=u})}

// ---------- overview: weight, real burn, last 7 days
// Real daily burn = average eaten − weight trend (kg/day) × 7700 kcal, from the last 28 days.
function realBurn(){
  const today=iso(new Date()), from=addDays(today,-28);
  const ws=Object.entries(weights).filter(([d])=>d>=from).sort();
  const days=Object.keys(log).filter(d=>d>=from&&d<today&&(log[d]||[]).length);
  if(ws.length<3||days.length<10)return {need:true,ws:ws.length,days:days.length};
  const span=(new Date(ws.at(-1)[0])-new Date(ws[0][0]))/864e5;if(span<14)return {need:true,ws:ws.length,days:days.length};
  const xs=ws.map(([d])=>(new Date(d)-new Date(ws[0][0]))/864e5), ys=ws.map(([,w])=>w), n=xs.length,
    mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n,
    slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  const eat=days.reduce((a,d)=>a+sum(log[d]).kcal,0)/days.length;
  return {burn:Math.round(eat-slope*7700),eat:Math.round(eat),weekly:r1(slope*7),days:days.length};
}
function weightChart(){
  const ws=Object.entries(weights).sort().slice(-60);if(ws.length<2)return "";
  const W=320,H=120,t0=new Date(ws[0][0]),span=Math.max(1,(new Date(ws.at(-1)[0])-t0)/864e5),
    lo=Math.min(...ws.map(x=>x[1]))-.5,hi=Math.max(...ws.map(x=>x[1]))+.5,
    X=d=>8+(new Date(d)-t0)/864e5/span*(W-16),Y=w=>8+(hi-w)/(hi-lo)*(H-16);
  const pts=ws.map(([d,w])=>`${X(d).toFixed(1)},${Y(w).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px" role="img" aria-label="Graf váhy">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ws.map(([d,w])=>`<circle cx="${X(d).toFixed(1)}" cy="${Y(w).toFixed(1)}" r="3.5" fill="var(--acc2)"/>`).join("")}
    <text x="8" y="${H-2}" fill="var(--mut)" font-size="10">${new Date(ws[0][0]).toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"})}</text>
    <text x="${W-8}" y="${H-2}" fill="var(--mut)" font-size="10" text-anchor="end">${new Date(ws.at(-1)[0]).toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"})}</text></svg>`;
}
